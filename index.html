<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Achadinhos</title>
    <!-- FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Barra de Busca */
        .search-container {
            margin-bottom: 30px;
            text-align: center;
        }

        .search-bar {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ee4d2d;
            border-radius: 25px;
            outline: none;
            transition: all 0.3s;
        }

        /* Grid de Produtos */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Card do Produto */
        .product-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .product-image-wrapper {
            width: 100%;
            height: 220px;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 14px;
            color: #333;
            font-weight: 500;
            line-height: 1.4;
            height: 40px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .price-container {
            margin-bottom: 12px;
        }

        .price-tag {
            font-size: 18px;
            color: #ee4d2d;
            font-weight: bold;
        }

        .btn-shopee {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #ee4d2d;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-shopee:hover {
            background-color: #d13b1f;
        }

        /* Mensagens de Status */
        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="search-container">
            <input type="text" id="searchBar" class="search-bar" placeholder="Buscar achadinho..." oninput="filterProducts()">
        </div>

        <div id="productGrid" class="product-grid">
            <div class="status-message">Carregando achadinhos...</div>
        </div>
    </div>

    <script>
        const URL_PLANILHA = `https://google.com`;

        let allProducts = [];

        window.addEventListener('DOMContentLoaded', fetchProducts);

        // Separa as colunas do CSV respeitando valores entre aspas
        function parseCSVLine(text) {
            let p = '', c = [];
            let q = false;
            for (let i = 0; i < text.length; i++) {
                let ch = text[i];
                if (ch === '"') { 
                    q = !q; 
                } else if (ch === ',' && !q) { 
                    c.push(p.trim()); 
                    p = ''; 
                } else { 
                    p += ch; 
                }
            }
            c.push(p.trim());
            return c;
        }

        async function fetchProducts() {
            const grid = document.getElementById('productGrid');
            try {
                const response = await fetch(URL_PLANILHA);
                if (!response.ok) throw new Error("Erro ao carregar a planilha");
                const csvText = await response.text();
                
                const lines = csvText.split(/\r?\n/);
                
                allProducts = lines.slice(1).map(line => {
                    if (!line || line.trim() === '') return null;

                    const columns = parseCSVLine(line);
                    if (columns.length < 3) return null;

                    // Remove aspas sobressalentes geradas pelo formato CSV
                    const limpar = (txt) => txt ? txt.replace(/^"|"\$/g, '').trim() : '';

                    // MAPEAMENTO CORRETO: [0] Nome, [1] Link, [2] Preço, [3] Imagem
                    const nome  = limpar(columns[0]);
                    const link  = limpar(columns[1]);
                    let preco   = limpar(columns[2]);
                    const img   = columns[3] ? limpar(columns[3]) : '';

                    // Garante que o preço exiba o cifrão R\(if (preco && !preco.toLowerCase().includes('r\)')) {
                        preco = 'R\$ ' + preco;
                    }

                    // Imagem padrão caso o campo esteja vazio
                    const imagemFinal = (img !== '') ? img : 'https://unsplash.com';

                    return { nome, img: imagemFinal, link, preco };
                }).filter(p => p !== null && p.nome !== '' && p.nome.toLowerCase() !== 'nome');

                allProducts.reverse(); 
                renderProducts(allProducts);
            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="status-message" style="color: #ee4d2d;"><i class="fa-solid fa-triangle-exclamation"></i> Erro ao carregar os dados. Verifique sua conexão ou se a planilha está pública.</div>`;
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            if (products.length === 0) {
                grid.innerHTML = `<div class="status-message">Nenhum achadinho encontrado.</div>`;
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-image-wrapper">
                        <img src="${p.img}" alt="${p.nome}" class="product-img" onerror="this.src='https://unsplash.com'">
                    </div>
                    <div class="product-info">
                        <h2 class="product-title" title="${p.nome}">${p.nome}</h2>
                        <div class="price-container">
                            <span class="price-tag">${p.preco}</span>
                        </div>
                        <a href="${p.link}" target="_blank" class="btn-shopee">
                            <i class="fa-solid fa-bag-shopping"></i> Eu quero!
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = allProducts.filter(p => p.nome.toLowerCase().includes(query));
            renderProducts(filtered);
        }
    </script>
</body>
</html>
