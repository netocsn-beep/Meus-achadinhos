    <script>
        const PLANILHA_ID = "10v0iA1qh3q5MHI7HKObh0uFqjZNf0hdizMspbK3i2ZM"; 
        const URL_PLANILHA = `https://docs.google.com/spreadsheets/d/e/2PACX-1vTlxx_OqrPm5WyOMndasHlbN4jelB847PENZjuXkhTccuRoBHKzTR1t5nC-UPln4gJiosQz1T_jKCJe/pub?output=csv`;

        let allProducts = [];

        // Inicializa a busca ao carregar a página
        window.addEventListener('DOMContentLoaded', fetchProducts);

        async function fetchProducts() {
            const grid = document.getElementById('productGrid');
            try {
                const response = await fetch(URL_PLANILHA);
                if (!response.ok) throw new Error("Erro ao carregar a planilha");
                const csvText = await response.text();
                
                const lines = csvText.split('\n');
                
                allProducts = lines.slice(1).map(line => {
                    if (!line || line.trim() === '') return null;

                    // Divide as colunas considerando possíveis aspas no CSV
                    const columns = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*\$)/);
                    if (columns.length < 3) return null;

                    const nome = columns[0] ? columns[0].replace(/"/g, '').trim() : '';
                    const link = columns[1] ? columns[1].replace(/"/g, '').trim() : '#';
                    
                    let preco = columns[2] ? columns[2].replace(/"/g, '').trim() : '';
                    if (preco && !preco.includes('R\$')) {
                        preco = 'R\$ ' + preco;
                    }

                    const img = (columns[3] && columns[3].replace(/"/g, '').trim() !== '') 
                                ? columns[3].replace(/"/g, '').trim() 
                                : 'https://unsplash.com';

                    return { nome, img, link, preco };
                }).filter(p => p !== null && p.nome !== '' && p.nome.toLowerCase() !== 'nome');

                allProducts.reverse(); 
                renderProducts(allProducts);
            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="status-message" style="color: #ee4d2d;"><i class="fa-solid fa-triangle-exclamation"></i> Certifique-se de que a planilha foi 'Publicada na Web' como CSV.</div>`;
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            if (products.length === 0) {
                grid.innerHTML = `<div class="status-message">Nenhum achadinho encontrado.</div>`;
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-image-wrapper">
                        <img src="${p.img}" alt="${p.nome}" class="product-img">
                    </div>
                    <div class="product-info">
                        <h2 class="product-title" title="${p.nome}">${p.nome}</h2>
                        <div class="price-container">
                            <span class="price-tag">${p.preco}</span>
                        </div>
                        <a href="${p.link}" target="_blank" class="btn-shopee">
                            <i class="fa-solid fa-bag-shopping"></i> Eu quero!
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = allProducts.filter(p => p.nome.toLowerCase().includes(query));
            renderProducts(filtered);
        }
    </script>
</body>
</html>
